// =============================================================================
// build.gradle — java-devops-project
// Gradle build script demonstrating:
//   1. Build automation with custom DevOps tasks
//   2. Dependency management (compile vs test scopes)
//   3. Fat JAR packaging for deployment
//   4. Build metadata generation
// =============================================================================

apply plugin: 'java'
apply plugin: 'application'
apply plugin: 'jacoco'

group   = 'com.devops'
version = '1.0.0'
sourceCompatibility = '17'
targetCompatibility = '17'

mainClassName = 'com.devops.app.Application'

repositories {
    mavenCentral()
}

// ---------------------------------------------------------------------------
// Dependencies
// Using Maven Central for all dependencies
// ---------------------------------------------------------------------------
dependencies {
    // ── Production runtime ─────────────────────────────────────────────────
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.14'
    implementation 'ch.qos.logback:logback-core:1.4.14'
    implementation 'com.google.guava:guava:33.0.0-jre'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.0'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.16.0'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.16.0'

    // ── Test ───────────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest-core:2.2'
}

// ---------------------------------------------------------------------------
// Test configuration
// ---------------------------------------------------------------------------
test {
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
    finalizedBy jacocoTestReport
}

// ---------------------------------------------------------------------------
// JaCoCo Code Coverage Configuration
// ---------------------------------------------------------------------------
jacoco {
    toolVersion = "0.8.10"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'CLASS'
            excludes = ['**/Application.class']
            
            limit {
                minimum = 0.70
            }
        }
    }
}

// ---------------------------------------------------------------------------
// JAR manifest — embeds version and build info into the JAR header
// ---------------------------------------------------------------------------
jar {
    manifest {
        attributes(
            'Main-Class'             : mainClassName,
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.version,
            'Built-By'               : 'Gradle DevOps Pipeline',
            'Build-Jdk'              : System.getProperty('java.version')
        )
    }
}

// ===========================================================================
// Custom DevOps Tasks
// ===========================================================================

// Task 1: Fat (uber) JAR — packages the app + all dependencies into one JAR
//         so it can be deployed to any server without extra classpath setup.
task fatJar(type: Jar) {
    group       = 'DevOps'
    description = 'Packages the application and all runtime dependencies into a single executable JAR'
    archiveClassifier = 'all'
    manifest { attributes 'Main-Class': mainClassName }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    doLast { println "Fat JAR -> ${archiveFile.get().asFile.absolutePath}" }
}

// Ensure fatJar runs after jar task
fatJar.dependsOn jar

// Make build task depend on fatJar
build.dependsOn fatJar

// Task 2: Dependency report — lists every resolved compile-time dependency.
//         Useful for auditing and licence checks in a CI pipeline.
task printDependencies {
    group       = 'DevOps'
    description = 'Prints all resolved compile-time dependencies to stdout'
    doLast {
        println "\n=== Compile Dependencies ==="
        configurations.runtimeClasspath.files.each { file ->
            println "  [DEP] ${file.name}"
        }
        println "=== End of dependency list ===\n"
    }
}

// Task 3: Build-info file — writes a properties file consumed by health-check
//         endpoints or deployment scripts to record what was deployed and when.
task generateBuildInfo {
    group       = 'DevOps'
    description = 'Writes build metadata (version, timestamp, JDK) to build/build-info.properties'
    doLast {
        def f = file("${buildDir}/build-info.properties")
        f.parentFile.mkdirs()
        f.text = [
            "build.version=${project.version}",
            "build.timestamp=${new Date().format('yyyy-MM-dd HH:mm:ss')}",
            "build.java.version=${System.getProperty('java.version')}",
            "build.gradle.version=${gradle.gradleVersion}",
            "build.group=${project.group}"
        ].join('\n') + '\n'
        println "Build info written -> ${f.absolutePath}"
    }
}

// Auto-generate the build-info file every time the project is assembled.
assemble.finalizedBy generateBuildInfo

// Task 4: End-to-end pipeline shortcut — mirrors what the CI server does:
//         clean workspace -> compile -> test -> package.
task cleanBuildDeploy {
    group       = 'DevOps'
    description = 'Convenience task: clean -> compile -> test -> assemble (mirrors CI pipeline)'
    dependsOn clean, build
    build.mustRunAfter clean
    doLast {
        println "\n✅  Full build pipeline completed — version ${project.version}"
    }
}
