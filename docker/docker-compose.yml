version: '3.9'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: java-devops-project:local
    container_name: java-devops-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - app-logs:/app/logs
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    healthcheck:
      test: ["CMD-SHELL", "java -version && echo healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  app-logs:
    driver: local
